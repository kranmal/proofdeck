<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1220">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>Proofdeck</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside class="side">
    <a class="brand" href="#/"><span class="logo" aria-hidden="true"></span>Proofdeck</a>
    <label class="proj">
      <span>Project</span>
      <select id="project"></select>
    </label>
    <nav id="nav">
      <a href="#/" data-nav="dash">Overview</a>
      <a href="#/cases" data-nav="cases">Test cases</a>
      <a href="#/plans" data-nav="plans">Test plans</a>
      <a href="#/cycles" data-nav="cycles">Test cycles</a>
      <a href="#/bugs" data-nav="bugs">Bugs</a>
      <a href="#/notifications" data-nav="notifications">Notifications</a>
      <a href="#/reports" data-nav="reports">Reports</a>
      <a href="#/trash" data-nav="trash">Trash</a>
      <a href="#/email-settings" data-nav="email-settings" data-admin hidden>Email</a>
      <a href="#/custom-fields" data-nav="custom-fields" data-admin hidden>Fields</a>
      <a href="#/api-tokens" data-nav="api-tokens" data-admin hidden>API tokens</a>
      <a href="#/audit" data-nav="audit" data-admin hidden>Activity</a>
      <a href="#/integrations" data-nav="integrations" data-admin hidden>Integrations</a>
      <a href="#/webhooks" data-nav="webhooks" data-admin hidden>Webhooks</a>
      <a href="#/sso" data-nav="sso" data-admin hidden>Single sign-on</a>
      <a href="#/users" data-nav="users" data-admin hidden>Users</a>
    </nav>
    <button class="btn ghost small" id="new-project" type="button">+ New project</button>
    <button class="me-btn" id="me" type="button" hidden></button>
  </aside>
  <main id="view" tabindex="-1"></main>
  <div id="auth" class="auth" hidden></div>
  <dialog id="dlg"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
